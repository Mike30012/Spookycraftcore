name: Build SpookyCraftCore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q SpookyCraftCore.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build
        working-directory: SpookyCraftCore
        run: gradle shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookyCraftCore
          path: SpookyCraftCore/build/libs/SpookyCraftCore.jar

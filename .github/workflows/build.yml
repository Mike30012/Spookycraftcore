name: Build SpookyCraftCore

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q SpookyCraftCore.zip
      - name: Shadow-Plugin auf passende Version setzen
        run: sed -i "s/version '9.6.1'/version '8.3.5'/" SpookyCraftCore/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: SpookyCraftCore
        run: gradle shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookyCraftCore
          path: SpookyCraftCore/build/libs/SpookyCraftCore.jar
      - name: Release mit jar veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SpookyCraftCore (neuester Build)
          files: SpookyCraftCore/build/libs/SpookyCraftCore.jar
